apiVersion: security.kubearmor.com/v1
kind: KubeArmorHostPolicy
metadata:
  name: mount
spec:
  action: Audit
  message: "Detected attempt to mount or unmount a filesystem"
  nodeSelector:
    matchLabels:
      kubearmor.io/hostname: '*'
  process:
    matchPaths:
    - execname: mount
    - execname: umount
    - execname: mount
    - execname: umount
    - execname: findmnt
    - execname: swapon
    - execname: swapoff
    - execname: losetup
    - execname: mount.nfs
    - execname: mount.cifs
  syscalls:
    matchSyscalls:
    - syscall:
      - mount
      - mount2
  severity: 2
  tags:
  - MITRE_T1547.009_BOOT_OR_LOGON_AUTOSTART
  - MITRE_T1078_VALID_ACCOUNTS
  - NIST_CM-3(5)
  - PCI_DSS_10.2.7
