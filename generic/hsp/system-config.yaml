apiVersion: security.kubearmor.com/v1
kind: KubeArmorHostPolicy
metadata:
  name: system-config
spec:
  action: Audit
  message: "Detected modification attempt of system configuration files"
  nodeSelector:
    matchLabels:
      kubearmor.io/hostname: '*'
  file:
    matchDirectories:
    - dir: /boot/
      readOnly: true
      recursive: true
    - dir: /etc/cups/
      readOnly: true
      recursive: true
    - dir: /etc/cupshelpers/
      readOnly: true
      recursive: true
    - dir: /etc/default/
      readOnly: true
      recursive: true
    - dir: /etc/ld.so.conf.d/
      readOnly: true
      recursive: true
    - dir: /etc/pam.d/
      readOnly: true
      recursive: true
    - dir: /etc/security/
      readOnly: true
      recursive: true
    - dir: /etc/ssh/
      readOnly: true
      recursive: true
    - dir: /etc/sudoers.d/
      readOnly: true
      recursive: true
    - dir: /etc/systemd/
      readOnly: true
      recursive: true
    matchPaths:
    - path: /etc/adduser.conf
      readOnly: true
    - path: /etc/bash.bashrc
      readOnly: true
    - path: /etc/default/grub
      readOnly: true
    - path: /etc/fstab
      readOnly: true
    - path: /etc/ld.so.conf
      readOnly: true
    - path: /etc/ld.so.preload
      readOnly: true
    - path: /etc/profile
      readOnly: true
    - path: /etc/sudo.conf
      readOnly: true
    - path: /etc/sudoers
      readOnly: true
    - path: /etc/sysctl.conf
      readOnly: true
    - path: /root/.bash_profile
      readOnly: true
    - path: /root/.bashrc
      readOnly: true
    - path: /root/.profile
      readOnly: true
    - path: /root/.shrc
      readOnly: true
    - path: /usr/local/etc/sudoers
      readOnly: true
  severity: 6
  tags:
  - MITRE_T1492_MODIFY_SYSTEM_IMAGE
  - NIST_CM-6
  - PCI_DSS_2.2.4

  
