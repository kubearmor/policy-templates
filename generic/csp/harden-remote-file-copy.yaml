apiVersion: security.kubearmor.com/v1
kind: KubeArmorClusterPolicy
metadata:
  annotations:
    app.accuknox.com/type: harden
  name: harden-remote-file-copy
spec:
  action: Block
  message: "Blocked Remote file copy utility execution"
  process:
    matchPaths:
      - execname: scp
      - execname: rsync
      - execname: sftp
      - execname: ftp
  selector:
    matchExpressions:
      - key: namespace
        operator: NotIn
        values:
          - kube-system
  severity: 5
  tags:
    - MITRE
    - MITRE_T1552_unsecured_credentials
    - MITRE_TA0006_credential_access
    - MITRE_TA0008_lateral_movement
    - MITRE_TA0010_exfiltration
    - NIST
    - NIST_800-53
    - NIST_800-53_SC-4
    - NIST_800-53_SI
