---
version: v0.2.3
policyRules:
  - name: cronjob-cfg
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: NIST-SI-4
          url:
            - https://csf.tools/reference/nist-sp-800-53/r5/si/si-4/
      tldr: Audit access to cronjob files as a part of system monitoring for better
        integrity
      detailed: System monitoring includes external and internal monitoring. External
        monitoring includes the observation of events occurring at system
        boundaries. Internal monitoring includes the observation of events
        occurring within the system. Organizations monitor systems, for example,
        by observing audit activities in real time or by observing other system
        aspects such as access patterns, characteristics of access, and other
        actions.
    yaml: cronjob-cfg.yaml
  - name: crypto-miners
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1496_resource_hijacking
          url:
            - https://attack.mitre.org/techniques/T1496/
      tldr: Cryptojacking, Crypto mining, Malware protection
      detailed: One common purpose for Resource Hijacking is to validate transactions
        of cryptocurrency networks and earn virtual currency. Adversaries may
        consume enough system resources to negatively impact and/or cause
        affected machines to become unresponsive. Servers and cloud-based
        systems are common targets because of the high potential for available
        resources.
    yaml: crypto-miners.yaml
  - name: file-integrity-monitoring
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1565_data_manipulation
          url:
            - https://attack.mitre.org/techniques/T1565/
      tldr: File Integrity Monitoring/Protection
      detailed: Adversaries may insert, delete, or manipulate data in order to
        influence external outcomes or hide activity, thus threatening the
        integrity of the data. By manipulating data, adversaries may attempt to
        affect a business process, organizational understanding, or decision
        making. The type of modification and the impact it will have depends on
        the target application and process as well as the goals and objectives
        of the adversary. For complex systems, an adversary would likely need
        special expertise and possibly access to specialized software related to
        the system that would typically be gained through a prolonged
        information gathering campaign in order to have the desired impact.
    yaml: file-integrity-monitoring.yaml
  - name: impair-defense
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: tactic-impair-defense
          url:
            - https://fight.mitre.org/techniques/FGT1562
      tldr: Audit defense control points to detect defense impairments
      detailed: Adversaries may maliciously modify components of a victim environment
        in order to hinder or disable defensive mechanisms. This not only
        involves impairing preventative defenses, such as firewalls and
        anti-virus, but also detection capabilities that defenders can use to
        audit activity and identify malicious behavior. This may also span both
        native defenses as well as supplemental capabilities installed by users
        and administrators.
    yaml: impair-defense.yaml
  - name: k8s-client-tool-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1609_container_administration_command
          url:
            - https://attack.mitre.org/techniques/T1609/
      tldr: Prevent execution of container administration tools within a container
      detailed: Adversaries may abuse a container administration service to execute
        commands within a container. A container administration service such as
        the Docker daemon, the Kubernetes API server, or the kubelet may allow
        remote management of containers within an environment.
    yaml: k8s-client-tool-exec.yaml
  - name: maint-tools-access
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE-TTP
          url:
            - https://attack.mitre.org/techniques/T1553/
      tldr: Restrict or limit maintenance tool usage
      detailed: Container images might contain maintenance tools which should ideally
        never be used in prod env, or if used, should be used only in certain
        time frames. Examples include, dynamic package management tools,
        mii-tool, iptables etc
    yaml: maint-tools-access.yaml
  - name: network-service-scanning
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: tactic-network-service-scanning
          url:
            - https://fight.mitre.org/techniques/FGT1046
      tldr: Audit execution of network service scanning tools
      detailed: Adversaries may attempt to get a listing of services running on remote
        hosts and local network infrastructure devices, including those that may
        be vulnerable to remote software exploitation. Common methods to acquire
        this information include port and/or vulnerability scans using tools
        that are brought onto a system.
    yaml: network-service-scanning.yaml
  - name: pkg-mngr-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: NIST-CM-7-5
          url:
            - https://csf.tools/reference/nist-sp-800-53/r5/cm/cm-7/cm-7-5/
      tldr: Prohibit package manager process execution in containers to maintain
        system integrity and limit authorized software versions and sources.
      detailed: Authorized software programs can be limited to specific versions or
        from a specific source. To facilitate a comprehensive authorized
        software process and increase the strength of protection for attacks
        that bypass application level authorized software, software programs may
        be decomposed into and monitored at different levels of detail. These
        levels include applications, application programming interfaces,
        application modules, scripts, system processes, system services, kernel
        functions, registries, drivers, and dynamic link libraries.
    yaml: pkg-mngr-exec.yaml
  - name: remote-file-copy
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_TA0010_exfiltration
          url:
            - https://attack.mitre.org/tactics/TA0010/
      tldr: Prevent data exfiltration attempts using utility tooling
      detailed: Exfiltration consists of techniques that adversaries may use to steal
        data from your network. Once they have collected data, adversaries often
        package it to avoid detection while removing it. This can include
        compression and encryption. Techniques for getting data out of a target
        network typically include transferring it over their command and control
        channel or an alternate channel and may also include putting size limits
        on the transmission.
    yaml: remote-file-copy.yaml
  - name: remote-services
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: tactic-remote-services
          url:
            - https://fight.mitre.org/techniques/FGT1021
      tldr: Audit remote access services
      detailed: Legitimate applications (such as Software Deployment Tools and other
        administrative programs) may utilize Remote Services to access remote
        hosts. For example, Apple Remote Desktop (ARD) on macOS is native
        software used for remote management. ARD leverages a blend of protocols,
        including VNC to send the screen and control buffers and SSH for secure
        file transfer.
    yaml: remote-services.yaml
  - name: trusted-cert-mod
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE-TTP
          url:
            - https://attack.mitre.org/techniques/T1553/
            - https://fight.mitre.org/techniques/FGT1555
      tldr: Prevent certificate bundle tampering
      detailed: Operating systems maintain a list of trusted certificates (often
        called trust bundles) in file system. These bundles decides which
        authorities are trusted. Subverting these trust controls would
        essentially allow an adversary to operate as a trusted entity.
        Adversaries may undermine security controls that will either warn users
        of untrusted activity or prevent execution of untrusted programs.
        Operating systems and security products may contain mechanisms to
        identify programs or websites as possessing some level of trust.
        Examples of such features would include a program being allowed to run
        because it is signed by a valid code signing certificate, a program
        prompting the user with a warning because it has an attribute set from
        being downloaded from the Internet, or getting an indication that you
        are about to connect to an untrusted site.
    yaml: trusted-cert-mod.yaml
  - name: write-etc-dir
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_TA0005_defense_evasion
          url:
            - https://attack.mitre.org/tactics/TA0005/
      tldr: Prevent concealment of adversarial processes
      detailed: Defense Evasion consists of techniques that adversaries use to avoid
        detection throughout their compromise. Techniques used for defense
        evasion include uninstalling/disabling security software or
        obfuscating/encrypting data and scripts. Adversaries also leverage and
        abuse trusted processes to hide and masquerade their malware. Other
        tactics’ techniques are cross-listed here when those techniques include
        the added benefit of subverting defenses.
    yaml: write-etc-dir.yaml
  - name: write-in-shm-dir
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_execution
          url:
            - https://attack.mitre.org/tactics/TA0002/
      tldr: Restrict adversaries from writing malicious code under the shm folder
      detailed: The adversary is trying to run malicious code. Execution consists of
        techniques that result in adversary-controlled code running on a local
        or remote system. Techniques that run malicious code are often paired
        with techniques from all other tactics to achieve broader goals, like
        exploring a network or stealing data.
    yaml: write-in-shm-dir.yaml
  - name: write-under-dev-dir
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: NIST-SI-4
          url:
            - https://csf.tools/reference/nist-sp-800-53/r5/si/si-4/
      tldr: Audit device directory for enhanced security
      detailed: System monitoring includes external and internal monitoring. External
        monitoring includes the observation of events occurring at system
        boundaries. Internal monitoring includes the observation of events
        occurring within the system. Organizations monitor systems, for example,
        by observing audit activities in real time or by observing other system
        aspects such as access patterns, characteristics of access, and other
        actions.
    yaml: write-under-dev-dir.yaml
  - name: audit-network-packet-tools
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1562_IMPAIR_DEFENSE
          url:
            - https://attack.mitre.org/techniques/T1562/004/
      tldr: Disable or modify system firewall
      detailed: Adversaries may modify or disable a system firewall to enable command
        and control (C2) communications, lateral movement, and data exfiltration
        that would otherwise be blocked.
    yaml: audit-network-packet-tools.yaml
  - name: audit-pen-test-recon-tools
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1046_NETWORK_SERVICE_SCANNING
          url:
            - https://attack.mitre.org/techniques/T1046/
      tldr: Discover network services and hosts
      detailed: Adversaries may attempt to get a listing of services running on remote
        hosts and local network devices, using port, vulnerability, or wordlist
        scans to identify potential attack surfaces.
    yaml: audit-pen-test-recon-tools.yaml
  - name: audit-process-exec-in-tmp
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1074_DATA_STAGED
          url:
            - https://attack.mitre.org/techniques/T1074/001/
      tldr: Stage collected data locally
      detailed: Adversaries may stage collected data in a central local location
        before exfiltration. This may involve combining files or using archive
        utilities to prepare data for later movement.
    yaml: audit-temp-usage.yaml
  - name: external-devices-connected
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1091_REPLICATION_THROUGH_REMOVABLE_MEDIA
          url:
            - https://attack.mitre.org/techniques/T1091/
      tldr: Replicate via removable media
      detailed: Adversaries may copy malware onto removable media to spread to other
        systems, including air-gapped networks, often using autorun or tricking
        users into executing malicious files.
    yaml: external-devices-connected.yaml
  - name: env-preset
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1059    
          url:
            - https://attack.mitre.org/techniques/T1059/
      tldr: Block unauthorized environment variable access.
      detailed: Adversaries may abuse command and script interpreters to execute commands, scripts, or binaries. These interfaces and languages provide ways of interacting with computer systems and are a common feature across many different platforms. Most systems come with some built-in command-line interface and scripting capabilities.
    yaml: env-preset.yaml
  
   
  - name: service-mgmt-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1543_create_or_modify_system_process
          url:
            - https://attack.mitre.org/techniques/T1543/
      tldr: Audit service management tools (systemctl, systemd, init, chkconfig, update-
        rc.d) running in containers
      detailed: Containers do not normally manage system services. Adversaries may create or
        modify system services to run malicious code or keep access. This policy
        audits execution of service management tools inside containers.
    yaml: service-mgmt-exec.yaml
  - name: cron-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1053.003_cron
          url:
            - https://attack.mitre.org/techniques/T1053/003/
      tldr: Audit execution of cron schedulers (crontab, cron, crond, anacron) in
        containers
      detailed: Adversaries may use cron to schedule malicious tasks or keep access. This
        policy audits execution of cron programs inside containers. It complements
        cronjob-cfg, which watches the cron configuration files.
    yaml: cron-exec.yaml
  - name: privilege-switch-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1548.003_sudo_and_sudo_caching
          url:
            - https://attack.mitre.org/techniques/T1548/003/
      tldr: Audit user-switching tools (su, sudo, login, newgrp, gosu and others) in
        containers
      detailed: Adversaries may switch users to gain higher privileges. Containers rarely
        need to switch users at runtime. This policy audits execution of user-
        switching and login tools inside containers.
    yaml: privilege-switch-exec.yaml
  - name: account-mgmt-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1136.001_create_local_account
          url:
            - https://attack.mitre.org/techniques/T1136/001/
      tldr: Audit password, user, group and shadow-file tools in containers
      detailed: Adversaries may create or change accounts and passwords to keep access. This
        policy audits execution of account management tools (passwd, useradd,
        groupadd, chage, vipw and others) inside containers.
    yaml: account-mgmt-exec.yaml
  - name: shell-mgmt-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1546.004_unix_shell_configuration_modification
          url:
            - https://attack.mitre.org/techniques/T1546/004/
      tldr: Audit changes to the list of allowed login shells (add-shell, remove-shell)
      detailed: Adversaries may change shell settings to keep access. This policy audits
        execution of add-shell and remove-shell inside containers.
    yaml: shell-mgmt-exec.yaml
  - name: setuid-binaries-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1548.001_setuid_and_setgid
          url:
            - https://attack.mitre.org/techniques/T1548/001/
      tldr: Audit execution of common SetUID programs in containers
      detailed: Programs with the SetUID bit run with the owner's privileges and can be
        abused to gain higher privileges. This policy audits execution of common
        SetUID programs (ping, bwrap, start-stop-daemon and others) inside
        containers.
    yaml: setuid-binaries-exec.yaml
  - name: compiler-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1027.004_compile_after_delivery
          url:
            - https://attack.mitre.org/techniques/T1027/004/
      tldr: Audit compilers and build tools running in containers
      detailed: Adversaries may build tools from source inside a running container to avoid
        detection. Production containers rarely need compilers. This policy audits
        execution of compilers and build tools (gcc, clang, make, cmake, llvm tools)
        inside containers.
    yaml: compiler-exec.yaml
  - name: java-spawns-shell
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1059.004_unix_shell
          url:
            - https://attack.mitre.org/techniques/T1059/004/
      tldr: Audit shells started by a Java process
      detailed: A Java application starting a shell can be a sign of remote code execution,
        for example through a vulnerable library. This policy audits shells (sh,
        bash, dash, zsh, csh) started by a Java process inside containers.
    yaml: java-spawns-shell.yaml
  - name: remote-access-server-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1021.004_ssh
          url:
            - https://attack.mitre.org/techniques/T1021/004/
      tldr: Audit SSH servers (sshd, dropbear) running in containers
      detailed: Containers rarely need an SSH server. Adversaries may start one to get
        remote access. This policy audits execution of SSH server programs inside
        containers.
    yaml: remote-access-server-exec.yaml
  - name: blockchain-node-exec
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1496_resource_hijacking
          url:
            - https://attack.mitre.org/techniques/T1496/
      tldr: Audit Ethereum node (geth) execution in containers
      detailed: geth can be used for mining but is also a normal Ethereum node, so it is
        audited instead of blocked. This policy audits execution of geth inside
        containers.
    yaml: blockchain-node-exec.yaml
  - name: sa-token-access
    precondition:
      - OPTSCAN
    description:
      refs:
        - name: MITRE_T1528_steal_application_access_token
          url:
            - https://attack.mitre.org/techniques/T1528/
      tldr: Audit reads of the Kubernetes service account token
      detailed: Adversaries may read the service account token to call the Kubernetes API.
        This policy audits reads of the service account token directory inside
        containers.
    yaml: sa-token-access.yaml
