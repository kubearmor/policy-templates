apiVersion: security.kubearmor.com/v1
kind: KubeArmorClusterPolicy
metadata:
  name: write-in-shm-dir
  annotations:
    app.accuknox.com/type: harden
spec:
  action: Audit
  file:
    matchDirectories:
      - dir: /dev/shm/
        readOnly: true
        recursive: true
  message: "Detected attempt to write to /dev/shm folder"
  selector:
    matchExpressions:
      - key: namespace
        operator: NotIn
        values:
          - kube-system
  severity: 7
  tags:
    - MITRE_TA0005_T1564.001
    - MITRE_TA0009_T1074
    - MITRE_TA0002_T1059.004
    - MITRE
    - NIST_PR.AC-4
    - PCI_DSS_11.5.1 
