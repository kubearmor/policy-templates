apiVersion: security.kubearmor.com/v1
kind: KubeArmorClusterPolicy
metadata:
  annotations:
    app.accuknox.com/type: harden
  name: audit-process-exec-in-tmp
spec:
  action: Audit
  severity: 3
  message: "Detected /tmp directory access"
  process:
    matchDirectories:
      - dir: /tmp/
        recursive: true
  selector:
    matchExpressions:
      - key: namespace
        operator: NotIn
        values:
          - kube-system
  tags:
    - MITRE_T1074_DATA_STAGED
    - NIST_AU-6  
    - PCI_DSS_10.2.6 
