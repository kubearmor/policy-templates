apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-non-rt-ric-sme-core
  namespace: nonrt-sec-plat
spec:
  podSelector:
    matchLabels: 
      app.kubernetes.io/name: sme-core
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kong 
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kong
    ports:
    - protocol: TCP
      port: 8000
