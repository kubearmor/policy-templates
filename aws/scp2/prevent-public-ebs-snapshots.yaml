Version: "2012-10-17"
Statement:
  - Sid: DenyDisablingSnapshotBlockPublicAccess
    Effect: Deny
    Action:
      - ec2:DisableSnapshotBlockPublicAccess
    Resource: "*"
  - Sid: DenyMakingEbsSnapshotsPublic
    Effect: Deny
    Action:
      - ec2:ModifySnapshotAttribute
    Resource: "*"
    Condition:
      StringEquals:
        ec2:Add/group: all
